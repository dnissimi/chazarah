title:
  he: "מפת הסוגיא — בכורות מ״ב"
  en: "Sugya map — Bekhorot 42"
blurb:
  he: "רב חסדא: המחלוקת במשנה באנדרוגינוס, אבל טומטום ספק לכולם וקדוש מספק; הגמרא מוחקת ׳טומטום׳ מברייתא אחר ברייתא. הדיון מתמקד בטומטום המטיל מים במקום נקבות — האם חוששים ׳שמא נהפכה זכרותו׳ (׳הואיל ואישתני, אישתני׳) — ומסתעף לברייתות על חליצה וייבום של טומטום, עד הבדלי ר׳ יהודה ור׳ יוסי בר׳ יהודה."
  en: "Rav Ḥisda: the Mishnah’s dispute concerns a hermaphrodite; a tumtum is a doubt for all and sacred out of doubt — so the Gemara strikes “tumtum” from baraita after baraita. The discussion turns on a tumtum urinating from the female place — do we fear its organ inverted (“since it changed, it changed”)? — and branches into the ḥalitza and levirate baraitot about a tumtum, down to the difference between R. Yehuda and R. Yosei b. R. Yehuda."
topic:
  he: "טומטום — ספק או בריה?"
  en: "A tumtum — doubt or distinct entity?"

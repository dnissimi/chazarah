title:
  he: "מפת הסוגיא — ברכות י״ג"
  en: "Sugya map — Berakhot 13"
blurb:
  he: "מסיום פרק ׳מאימתי׳ (יציאת מצרים לימות המשיח; אברם–אברהם) אל פתיחת ׳היה קורא׳: קריאת שמע ככתבה (רבי) או בכל לשון (חכמים); עד היכן צריכה כוונה — כל הפרשה (ר׳ עקיבא), הפרק הראשון (ר׳ אחא), או הפסוק הראשון בלבד (ר׳ מאיר — והלכה כמותו); המאריך ב׳אחד׳; עמידה ופרקדן; והפסקה לשאילת שלום — המשנה חסורי מחסרא."
  en: "From the close of chapter “Me’eimatai” (the Exodus in Messianic days; Abram→Abraham) to the opening of “Haya Korei”: Shema as written (Rabbi) or in any language (the Rabbis); how far intent extends — the whole paragraph (R. Akiva), the first paragraph (R. Aḥa), or the first verse alone (R. Meir — the accepted ruling); lengthening eḥad; standing, and lying on one’s back; and greeting mid-Shema — the Mishnah is emended."
topic:
  he: "כוונה בקריאת שמע — ולשונה"
  en: "Intent in Shema — and its language"
